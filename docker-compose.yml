version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: twinedge_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./backend/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7.6
    container_name: twinedge_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-twinedge}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-telemetry}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: twinedge_backend
    ports:
      - "8000:8000"
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - MQTT_HOST=${MQTT_HOST:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - INFLUXDB_URL=${INFLUXDB_URL:-http://influxdb:8086}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-twinedge}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-telemetry}
    volumes:
      - ./backend:/app
    restart: unless-stopped

  subscriber:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: twinedge_subscriber
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - MQTT_HOST=${MQTT_HOST:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - INFLUXDB_URL=${INFLUXDB_URL:-http://influxdb:8086}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-twinedge}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-telemetry}
    volumes:
      - ./backend:/app
    command: ["python3", "app/influx_writer.py"]
    restart: unless-stopped

  postgres:
    image: postgres:16.8-alpine
    container_name: twinedge_postgres
    profiles:
      - pg
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-twinedge}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_master_secret}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
      - POSTGRES_APP_USER=${POSTGRES_APP_USER:-twinedge_app}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD:-twinedge_app_secret}
      - POSTGRES_MIGRATOR_USER=${POSTGRES_MIGRATOR_USER:-twinedge_migrator}
      - POSTGRES_MIGRATOR_PASSWORD=${POSTGRES_MIGRATOR_PASSWORD:-twinedge_migrator_secret}
      - POSTGRES_RO_USER=${POSTGRES_RO_USER:-twinedge_ro}
      - POSTGRES_RO_PASSWORD=${POSTGRES_RO_PASSWORD:-twinedge_ro_secret}
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=30
      -c password_encryption=scram-sha-256
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-twinedge}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/01-init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    restart: unless-stopped

volumes:
  influxdb_data:
  postgres_data:
